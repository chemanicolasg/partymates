[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker must always be fresh so players get new versions of the game.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The teachers' panel is a page of the same app.
[[redirects]]
  from = "/docente"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/docente/*"
  to = "/index.html"
  status = 200
